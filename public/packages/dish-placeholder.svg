<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Sylvia's dish">
  <rect width="320" height="200" fill="#1a1206"/>
  <rect width="320" height="200" fill="url(#g)"/>
  <defs>
    <radialGradient id="g" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#2a1f0d"/>
      <stop offset="100%" stop-color="#160f05"/>
    </radialGradient>
  </defs>
  <!-- plate -->
  <circle cx="160" cy="88" r="44" fill="none" stroke="#c8a34e" stroke-width="3"/>
  <circle cx="160" cy="88" r="29" fill="none" stroke="#c8a34e" stroke-width="1.5" opacity="0.55"/>
  <!-- fork -->
  <g stroke="#c8a34e" stroke-width="2.4" stroke-linecap="round" fill="none">
    <line x1="112" y1="66" x2="112" y2="82"/>
    <line x1="119" y1="66" x2="119" y2="82"/>
    <line x1="126" y1="66" x2="126" y2="82"/>
    <line x1="119" y1="82" x2="119" y2="118"/>
    <!-- knife -->
    <line x1="201" y1="66" x2="201" y2="118"/>
    <path d="M201 66 q10 6 0 26" stroke-width="2.4"/>
  </g>
  <text x="160" y="162" text-anchor="middle" fill="#c8a34e" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic">Sylvia&#8217;s</text>
  <text x="160" y="181" text-anchor="middle" fill="#8a7a55" font-family="system-ui, sans-serif" font-size="10" letter-spacing="1.5">SOUL FOOD</text>
</svg>
